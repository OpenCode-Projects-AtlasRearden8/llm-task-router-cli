[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-task-router-cli"
version = "0.1.0"
description = "Sort everyday AI tasks into quick-job vs. deep-think and emit a local-first YAML routing ruleset. No API keys, ever."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["ai", "llm", "ollama", "router", "yaml", "local-first"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://dylanasdale.github.io"

[project.scripts]
llm-task-router = "llm_task_router.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "flake8"]

[tool.setuptools]
packages = ["llm_task_router"]
